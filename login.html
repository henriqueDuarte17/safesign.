<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSign — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <div class="left-panel">
    <div class="panel-content">
      <div class="brand">Safe<span>Sign.</span></div>
      <h1 class="panel-tagline">Assine com<br><em>confiança total.</em></h1>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-header">
      <h2 id="formTitle">Bem-vindo de volta</h2>
      <p id="formSub">Aceda à sua conta SafeSign</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('register')">Criar Conta</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="loginSection">
      <div class="nota-entrar"><strong>Use uma conta nova ou use credenciais já registadas.</strong></div>
      <div class="campo">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="o@email.com">
      </div>
      <div class="campo">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="error-msg" id="loginError">Email ou password incorretos.</div>
      </div>
      <button class="btn-submit" onclick="doLogin()">Entrar na Plataforma</button>
    </div>

    <!-- REGISTO -->
    <div class="form-section" id="registerSection">
      <div class="campo">
        <label>Nome completo</label>
        <input type="text" id="regName" placeholder="João Silva">
      </div>
      <div class="campo">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="o@email.com">
      </div>
      <div class="campo">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')doRegister()">
        <div class="error-msg" id="regError"></div>
      </div>
      <button class="btn-submit" onclick="doRegister()">Criar Conta</button>
    </div>

    <div class="form-footer"><a href="index.html">← Voltar ao site</a></div>
  </div>
    <style>
    :root {
      --main: #407ebd;
      --main-dark: #2c5aa0;
      --dark: #0D2B45;
      --bg: #F4F7F9;
      --white: #ffffff;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* LEFT */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 8rem;
      position: relative;
      overflow: hidden;
    }
    
    .panel-content { position: relative; z-index: 1; }
    .brand { font-size: 28px; font-weight: 700; color: var(--white); margin-bottom: 4rem; letter-spacing: -0.02em; }
    .brand span { color: var(--main); }
    .panel-tagline { font-size: 46px; font-weight: 700; color: var(--white); line-height: 1.15; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
    .panel-tagline em { font-style: normal; color: var(--main); }
    
    /* RIGHT */
    .right-panel {
      width: 600px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 3.5rem;
    }
    .form-header { margin-bottom: 2rem; }
    .form-header h2 { font-size: 26px; font-weight: 700; color: var(--dark); letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .form-header p { font-size: 16px; color: rgba(13,43,69,0.5); }
    .tabs { display: flex; background: rgba(13,43,69,0.06); border-radius: 10px; padding: 4px; margin-bottom: 1.8rem; }
    .tab {
      flex: 1; padding: 0.6rem; border: none; background: transparent;
      border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
      color: rgba(13,43,69,0.45); transition: 0.2s;
    }
    .tab.active { background: var(--white); color: var(--dark); box-shadow: 0 2px 8px rgba(13,43,69,0.1); }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .campo { margin-bottom: 1.1rem; }
    .campo label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(13,43,69,0.5); margin-bottom: 0.45rem; }
    .campo input {
      width: 100%; padding: 0.8rem 1rem;
      border: 1.5px solid rgba(13,43,69,0.13);
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--dark); background: var(--white); outline: none; transition: 0.2s;
    }
    .campo input:focus { border-color: var(--main); box-shadow: 0 0 0 3px rgba(64,126,189,0.12); }
    .campo input::placeholder { color: rgba(13,43,69,0.28); }

    .error-msg { font-size: 12px; color: #c0392b; margin-top: 0.35rem; display: none; }

    .btn-submit {
      width: 100%; padding: 0.9rem;
      background: var(--dark); color: var(--white);
      border: none; border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 0.5rem; transition: 0.2s;
    }
    .btn-submit:hover { background: var(--main); }

      .nota-entrar {
        background: rgba(64,126,189,0.08);
      border: 1px solid rgba(64,126,189,0.2);
      border-radius: 10px; padding: 0.8rem 1rem;
      font-size: 12px; color: var(--main-dark); margin-bottom: 1.4rem; line-height: 1.6;
    }
    .form-footer { margin-top: 2rem; text-align: center; font-size: 12px; color: rgba(13,43,69,0.4); }
    .form-footer a { color: var(--main); text-decoration: none; font-weight: 500; }

  </style>

  <script>
    const DB   = 'safesign_users';
    const SESS = 'safesign_session';
    function getUsers()    { try { return JSON.parse(localStorage.getItem(DB)||'{}'); } catch { return {}; } }
    function saveUsers(u)  { localStorage.setItem(DB, JSON.stringify(u)); }

    // auto-redirect if already logged in
    const existing = sessionStorage.getItem(SESS);
    if (existing && getUsers()[existing]) window.location.href = 'dashboard.html';

    function switchTab(tab) {
      const login = tab === 'login';
      document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('active', login ? i===0 : i===1));
      document.getElementById('loginSection').classList.toggle('active', login);
      document.getElementById('registerSection').classList.toggle('active', !login);
      document.getElementById('formTitle').textContent = login ? 'Bem-vindo de volta' : 'Criar nova conta';
      document.getElementById('formSub').textContent   = login ? 'Aceda à sua conta SafeSign' : 'Registe-se gratuitamente';
    }

    function showErr(id, msg) { const e = document.getElementById(id); e.textContent = msg; e.style.display = 'block'; }
    function hideErr(id)      { document.getElementById(id).style.display = 'none'; }

    function doLogin() {
      hideErr('loginError');
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value;
      if (!email || !pass) { showErr('loginError','Preencha todos os campos.'); return; }
      const users = getUsers();
      if (!users[email] || users[email].password !== pass) { showErr('loginError','Email ou password incorretos.'); return; }
      sessionStorage.setItem(SESS, email);
      window.location.href = 'dashboard.html';
    }

    function doRegister() {
      hideErr('regError');
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass  = document.getElementById('regPass').value;
      if (!name || !email || !pass) { showErr('regError','Preencha todos os campos.'); return; }
      if (pass.length < 6) { showErr('regError','Password deve ter pelo menos 6 caracteres.'); return; }
      const users = getUsers();
      if (users[email]) { showErr('regError','Este email já está registado.'); return; }
      users[email] = { name, password: pass, documents: [] };
      saveUsers(users);
      sessionStorage.setItem(SESS, email);
      window.location.href = 'dashboard.html';
    }
  </script>
  
</body>
</html>
